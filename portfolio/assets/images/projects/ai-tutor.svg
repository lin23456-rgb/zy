<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="AI 课程问答助手封面">
  <defs>
    <linearGradient id="at-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F3"/>
      <stop offset="1" stop-color="#EFE8DD"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#at-bg)"/>
  <!-- knowledge base document (left) -->
  <g transform="translate(80,220)">
    <rect x="0" y="0" width="320" height="360" rx="12" fill="#FFFFFF" stroke="#E2D9CC" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="50" rx="12" fill="#F7F3EE"/>
    <rect x="24" y="18" width="120" height="14" rx="7" fill="#D2543A"/>
    <circle cx="290" cy="25" r="6" fill="#E2D9CC"/>
    <!-- doc lines (讲义/知识库) -->
    <g transform="translate(24,80)" fill="#8A8178">
      <rect width="272" height="10" rx="5"/>
      <rect y="26" width="272" height="10" rx="5"/>
      <rect y="52" width="220" height="10" rx="5"/>
      <rect y="92" width="272" height="10" rx="5"/>
      <rect y="118" width="240" height="10" rx="5"/>
      <rect y="144" width="180" height="10" rx="5"/>
    </g>
    <!-- vector nodes -->
    <g transform="translate(40,260)">
      <circle cx="0" cy="0" r="8" fill="#D2543A"/>
      <circle cx="60" cy="20" r="8" fill="#D2543A" opacity="0.6"/>
      <circle cx="120" cy="-10" r="8" fill="#D2543A" opacity="0.6"/>
      <circle cx="180" cy="24" r="8" fill="#D2543A" opacity="0.4"/>
      <line x1="0" y1="0" x2="60" y2="20" stroke="#D2543A" stroke-width="1.5" opacity="0.5"/>
      <line x1="60" y1="20" x2="120" y2="-10" stroke="#D2543A" stroke-width="1.5" opacity="0.5"/>
      <line x1="120" y1="-10" x2="180" y2="24" stroke="#D2543A" stroke-width="1.5" opacity="0.5"/>
    </g>
  </g>
  <!-- connection lines to chat -->
  <g stroke="#D2543A" stroke-width="1.5" opacity="0.4" stroke-dasharray="6 6">
    <line x1="410" y1="380" x2="560" y2="320"/>
    <line x1="410" y1="430" x2="560" y2="430"/>
    <line x1="410" y1="480" x2="560" y2="540"/>
  </g>
  <!-- chat window (right) -->
  <g transform="translate(560,180)">
    <rect x="0" y="0" width="560" height="440" rx="16" fill="#FFFFFF" stroke="#E2D9CC" stroke-width="2"/>
    <rect x="0" y="0" width="560" height="56" rx="16" fill="#F7F3EE"/>
    <circle cx="36" cy="28" r="12" fill="#D2543A"/>
    <rect x="60" y="20" width="160" height="16" rx="8" fill="#4A4A4A"/>
    <!-- user bubble -->
    <g transform="translate(300,90)">
      <rect x="0" y="0" width="220" height="60" rx="12" fill="#EFE8DD"/>
      <rect x="20" y="16" width="180" height="10" rx="5" fill="#4A4A4A"/>
      <rect x="20" y="34" width="120" height="10" rx="5" fill="#8A8178"/>
    </g>
    <!-- AI bubble -->
    <g transform="translate(40,180)">
      <rect x="0" y="0" width="300" height="100" rx="12" fill="#D2543A" opacity="0.10"/>
      <rect x="20" y="20" width="220" height="10" rx="5" fill="#D2543A"/>
      <rect x="20" y="40" width="260" height="10" rx="5" fill="#D2543A" opacity="0.7"/>
      <rect x="20" y="60" width="160" height="10" rx="5" fill="#D2543A" opacity="0.5"/>
      <!-- citation tag -->
      <rect x="20" y="78" width="80" height="14" rx="7" fill="#D2543A" opacity="0.15"/>
    </g>
    <!-- input bar -->
    <rect x="24" y="360" width="512" height="48" rx="24" fill="#FBF8F3" stroke="#E2D9CC"/>
    <rect x="48" y="344" width="0" height="0"/>
    <rect x="48" y="376" width="240" height="16" rx="8" fill="#E2D9CC"/>
    <circle cx="500" cy="384" r="16" fill="#D2543A"/>
    <path d="M494 384 L500 378 L506 384 L500 390 Z" fill="#FBF8F3"/>
  </g>
</svg>
