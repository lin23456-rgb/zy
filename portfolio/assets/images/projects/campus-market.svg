<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="校园二手交易平台封面">
  <defs>
    <linearGradient id="cm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F3"/>
      <stop offset="1" stop-color="#EFE8DD"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#cm-bg)"/>
  <!-- app window -->
  <g transform="translate(120,220)">
    <rect x="0" y="0" width="960" height="440" rx="16" fill="#FFFFFF" stroke="#E2D9CC" stroke-width="2"/>
    <rect x="0" y="0" width="960" height="56" rx="16" fill="#F7F3EE"/>
    <circle cx="40" cy="28" r="7" fill="#D2543A"/>
    <circle cx="66" cy="28" r="7" fill="#E2D9CC"/>
    <circle cx="92" cy="28" r="7" fill="#E2D9CC"/>
    <rect x="130" y="20" width="180" height="16" rx="8" fill="#E2D9CC"/>
    <!-- search bar -->
    <rect x="40" y="80" width="880" height="44" rx="22" fill="#FBF8F3" stroke="#E2D9CC"/>
    <circle cx="78" cy="102" r="8" fill="none" stroke="#8A8178" stroke-width="2"/>
    <line x1="84" y1="108" x2="92" y2="116" stroke="#8A8178" stroke-width="2"/>
    <!-- product cards -->
    <g transform="translate(40,150)">
      <rect width="270" height="240" rx="12" fill="#FBF8F3" stroke="#E2D9CC"/>
      <rect x="16" y="16" width="238" height="120" rx="8" fill="#EFE8DD"/>
      <rect x="16" y="152" width="120" height="12" rx="6" fill="#4A4A4A"/>
      <rect x="16" y="176" width="80" height="10" rx="5" fill="#8A8178"/>
      <rect x="190" y="146" width="64" height="22" rx="11" fill="#D2543A"/>
    </g>
    <g transform="translate(345,150)">
      <rect width="270" height="240" rx="12" fill="#FBF8F3" stroke="#E2D9CC"/>
      <rect x="16" y="16" width="238" height="120" rx="8" fill="#EFE8DD"/>
      <rect x="16" y="152" width="140" height="12" rx="6" fill="#4A4A4A"/>
      <rect x="16" y="176" width="70" height="10" rx="5" fill="#8A8178"/>
      <rect x="190" y="146" width="64" height="22" rx="11" fill="#D2543A"/>
    </g>
    <g transform="translate(650,150)">
      <rect width="270" height="240" rx="12" fill="#FBF8F3" stroke="#E2D9CC"/>
      <rect x="16" y="16" width="238" height="120" rx="8" fill="#EFE8DD"/>
      <rect x="16" y="152" width="100" height="12" rx="6" fill="#4A4A4A"/>
      <rect x="16" y="176" width="90" height="10" rx="5" fill="#8A8178"/>
      <rect x="190" y="146" width="64" height="22" rx="11" fill="#D2543A"/>
    </g>
  </g>
  <!-- chat bubble (私信) -->
  <g transform="translate(900,560)">
    <rect x="0" y="0" width="200" height="90" rx="14" fill="#D2543A"/>
    <path d="M30 90 L30 110 L52 90 Z" fill="#D2543A"/>
    <rect x="24" y="24" width="120" height="10" rx="5" fill="#FBF8F3"/>
    <rect x="24" y="46" width="90" height="10" rx="5" fill="#FBF8F3" opacity="0.8"/>
    <circle cx="170" cy="58" r="14" fill="#FBF8F3"/>
    <path d="M170 50 L170 66 M162 58 L178 58" stroke="#D2543A" stroke-width="2.5"/>
  </g>
</svg>
